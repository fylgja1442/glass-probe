name: sim

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "runs-on label (xcode-27 = Xcode 27 image, macos-26 = Xcode 26.x image)"
        default: "macos-26"
      xcode:
        description: "Xcode app path (macos-26 image: /Applications/Xcode_26.6.app)"
        default: ""
      url:
        description: "optional http(s) page to load in an extra remote state"
        default: ""
  push:
    branches: [main]

jobs:
  sim:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash # runs "bash -eo pipefail", so a failing xcodebuild in a pipe fails the step
    env:
      BID: test.glassprobe.app
      REMOTE_URL: ${{ inputs.url }}
    steps:
      - uses: actions/checkout@v7

      - name: Pick Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X="${{ inputs.xcode }}"
          # no path given, or it is not on this image: take the newest Xcode installed
          [ -n "$X" ] && [ -d "$X" ] || X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "using $X"
          echo "DEVELOPER_DIR=$X/Contents/Developer" >> "$GITHUB_ENV"

      - name: Show environment
        run: |
          mkdir -p out
          { sw_vers; xcodebuild -version; xcrun --sdk iphonesimulator --show-sdk-version; xcrun simctl list runtimes; } 2>&1 | tee out/env.txt

      - name: Pick newest iPhone Pro simulator
        run: |
          xcrun simctl list devices available -j > out/devices.json
          # numeric sort on runtime version (iOS-27-10 after iOS-27-2) then on the iPhone number
          SEL=$(jq -c '[.devices | to_entries[] | select(.key | test("SimRuntime.iOS-")) | .key as $k | .value[] | select(.name | test("^iPhone [0-9]+ Pro$")) | {k:($k | split("iOS-")[1] | split("-") | map(tonumber)), n:(.name | capture("^iPhone (?<x>[0-9]+)").x | tonumber), runtime:$k, name:.name, udid:.udid}] | sort_by([.k, .n]) | last // empty' out/devices.json)
          test -n "$SEL" || { echo "no iPhone Pro simulator found"; exit 1; }
          echo "$SEL" | tee out/device.txt
          echo "UDID=$(echo "$SEL" | jq -r .udid)" >> "$GITHUB_ENV"

      - name: Install XcodeGen and generate project
        timeout-minutes: 5
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate

      - name: Build for simulator (no signing)
        timeout-minutes: 8
        run: |
          xcodebuild -project GlassProbe.xcodeproj -scheme GlassProbe -configuration Debug \
            -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee out/build.log
          test -d build/Build/Products/Debug-iphonesimulator/GlassProbe.app

      - name: Boot and install
        timeout-minutes: 5
        run: |
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          sleep 5
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/GlassProbe.app

      # Stills use -freeze 1 (page does not scroll) so the backdrop is the same in every run.
      - name: Screenshots for each state
        timeout-minutes: 6
        run: |
          shoot() {
            name=$1; shift
            xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BID" -freeze 1 "$@"
            sleep 8
            xcrun simctl io "$UDID" screenshot "out/$name.png"
            test -s "out/$name.png"
          }
          shoot native -state native
          shoot bar -state bar
          shoot bar-light -state bar -light 1
          shoot bar-edge -state bar -edge 1
          shoot bar-insets -state bar -insets 1
          shoot menu -state menu
          shoot realmenu -state realmenu
          shoot sheet -state sheet
          shoot toolbar -state toolbar
          if [ -n "$REMOTE_URL" ]; then shoot remote -state bar -url "$REMOTE_URL"; fi

      - name: Record 6 seconds of the bar state (page scrolling)
        timeout-minutes: 2
        run: |
          set -m # job control on, otherwise a background job ignores SIGINT
          xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
          xcrun simctl launch "$UDID" "$BID" -state bar
          sleep 5
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force out/bar.mp4 &
          REC=$!
          sleep 6
          kill -INT "$REC"
          for i in $(seq 30); do kill -0 "$REC" 2>/dev/null || break; sleep 1; done
          if kill -0 "$REC" 2>/dev/null; then kill -KILL "$REC"; echo "recorder did not stop after SIGINT"; exit 1; fi
          test -s out/bar.mp4

      - name: Upload screenshots, video, build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: glass-sim
          path: out/
          if-no-files-found: error

      # Live state: runs only when both secrets are set. Nothing from it goes into the plain artifact above.
      - name: Live gate
        id: gate
        env:
          PAGE_URL: ${{ secrets.PAGE_URL }}
          DRIVER_URL: ${{ secrets.DRIVER_URL }}
        run: |
          if [ -n "$PAGE_URL" ] && [ -n "$DRIVER_URL" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "live state skipped"; fi

      - name: Live state (video and screenshots, kept private)
        if: steps.gate.outputs.go == '1'
        timeout-minutes: 8
        env:
          PAGE_URL: ${{ secrets.PAGE_URL }}
          DRIVER_URL: ${{ secrets.DRIVER_URL }}
        run: |
          set -m # job control on, otherwise a background job ignores SIGINT
          mkdir -p live
          exec >> live/log.txt 2>&1 # no set -x, and the log is only ever uploaded encrypted
          xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
          D=$(xcrun simctl get_app_container "$UDID" "$BID" data)
          rm -f "$D/Documents/ready.txt"
          xcrun simctl launch "$UDID" "$BID" -state live -url "$PAGE_URL" -driver "$DRIVER_URL" -demo 1
          for i in $(seq 400); do [ -s "$D/Documents/ready.txt" ] && break; sleep 0.5; done
          if [ ! -s "$D/Documents/ready.txt" ]; then
            echo "NOREADY" > live/ready.txt
            xcrun simctl io "$UDID" screenshot live/live-bar.png
            exit 0
          fi
          cp "$D/Documents/ready.txt" live/ready.txt
          T0=$SECONDS
          at() { while [ $((SECONDS - T0)) -lt "$1" ]; do sleep 0.5; done; }
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force live/live.mp4 &
          REC=$!
          at 2; xcrun simctl io "$UDID" screenshot live/live-bar.png
          at 7; xcrun simctl io "$UDID" screenshot live/live-menu.png
          at 12; xcrun simctl io "$UDID" screenshot live/live-sheet.png
          at 18
          kill -INT "$REC"
          for i in $(seq 30); do kill -0 "$REC" 2>/dev/null || break; sleep 1; done
          if kill -0 "$REC" 2>/dev/null; then kill -KILL "$REC"; echo "recorder did not stop after SIGINT"; exit 1; fi

      - name: Encrypt live results
        if: always() && steps.gate.outputs.go == '1'
        run: |
          trap 'rm -rf live live.tar live.key' EXIT # plain files never survive this step
          test -d live
          OSSL=/opt/homebrew/opt/openssl@3/bin/openssl
          [ -x "$OSSL" ] || OSSL=openssl
          "$OSSL" version
          tar -cf live.tar -C live .
          "$OSSL" rand -hex 32 > live.key
          "$OSSL" enc -aes-256-cbc -pbkdf2 -iter 10000 -md sha256 -pass file:live.key -in live.tar -out live.tar.enc
          "$OSSL" pkeyutl -encrypt -pubin -inkey art_pub.pem -pkeyopt rsa_padding_mode:oaep -in live.key -out live.key.enc
          test -s live.tar.enc && test -s live.key.enc

      - name: Upload encrypted live results
        if: always() && steps.gate.outputs.go == '1'
        uses: actions/upload-artifact@v7
        with:
          name: glass-live
          path: |
            live.tar.enc
            live.key.enc
          retention-days: 1
          if-no-files-found: error
